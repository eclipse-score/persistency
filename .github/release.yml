# Layout of the notes GitHub generates for releases (see release_core.yml).
# A PR lands in the first matching category, so "Updates" must stay first.
changelog:
  categories:
    - title: Dependency and Tool Updates
      labels:
        - dependencies
        - renovate
    - title: Other Changes
      labels:
        - "*"

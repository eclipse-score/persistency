# Module targets and instrumentation stay here; shared CI owns execution and reports.
# Reference: https://github.com/eclipse-score/cicd-workflows/blob/central-workflow/.github/workflows/on-pr.md
schema-version: 2
tests:
  linux-unit:
    bazel-configs: score-linux-x86_64
    bazel-build-targets: //score/kvs //score/kvs/rust_kvs:rust_kvs //score/kvs/rust_kvs_tool:kvs_tool
    bazel-test-targets: //:unit_tests
  # Miri uses the module's dedicated toolchain and remains a separate check.
  linux-miri:
    bazel-configs: score-linux-x86_64
    bazel-test-targets: //score/kvs/rust_kvs:unit_tests_miri
    bazel-test-custom-cli-args: --test_output=all
  # ITF starts Docker containers; retain these reports for documentation links.
  linux-integration:
    bazel-configs: score-linux-x86_64
    bazel-test-targets: //:cit_tests
coverage:
  linux:
    os: linux
    architecture: x86_64
    bazel-configs: llvm_cov
    # Container coverage data does not reach Bazel; these tests run above.
    bazel-targets: //score/... -//score/kvs/rust_kvs_tool/tests/...
    report-bazel-target: '@score_coverage//:generate_coverage_html'
    justifications-yaml: quality/coverage/coverage_justifications.yaml
    testlogs-subdir: score
    # Report-only while tests and coverage justifications are introduced.
    coverage-threshold: 0
    artifact-name: '{repository}_coverage_report'
docs:
  tests: linux-integration-tests
  coverage: linux-coverage
  retention-days: 3

name: Bazel Clippy

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]

jobs:
  bazel-clippy:
    uses: eclipse-score/cicd-workflows/.github/workflows/static-analysis.yml@f77ed751fa587e3a1142b2d85320917e00c888ae # v0.0.3-32-g8ab7396
    permissions:
      contents: read
    with:
      bazel-targets: "//score/kvs/rust_kvs/... //score/kvs/rust_kvs_tool/..."
      # TODO: switch back to "lint" once score.bazelrc/score_lint.bazelrc defines a real lint config.
      bazel-config: "score-linux-x86_64"
      bazel-args: "--lockfile_mode=error"

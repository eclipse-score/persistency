name: License check preparation

on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]

permissions:
  pull-requests: write
  issues: write

jobs:
  license-check:
    # Run merge groups ||
    # same-repository PRs without approval ||
    if: >-
      (github.event_name == 'merge_group') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    uses: eclipse-score/cicd-workflows/.github/workflows/license-check.yml@7d688a1f67201f9267bd31374d293c1ebda58732 # v0.0.3-43-7e8ea4c
    with:
      repo-url: "${{ github.server_url }}/${{ github.repository }}"
      bazel-target: "run --lockfile_mode=error //tools:license-check"
    secrets:
      dash-api-token: ${{ secrets.ECLIPSE_GITLAB_API_TOKEN }}

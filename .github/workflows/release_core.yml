name: Release Core

# Assembles a DRAFT GitHub release from an already verified commit: validates the
# tag, collects assets (docs, SBOM, reports), renders the release body, optionally
# tags the commit and runs `gh release create`.
# Called by release.yml, which owns the verification jobs. Free of persistency
# specifics so it can be proposed to eclipse-score/cicd-workflows later.
#
# Tagged docs are not published here: publishing the draft fires `release: published`,
# which docs.yml turns into a deployment under /<tag>/. A release created with
# GITHUB_TOKEN triggers no other workflow, but publishing it manually does.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v1.2.3. Must match `tag-pattern` and must not exist yet.
        required: true
        type: string
      dry-run:
        description: Build and collect all assets, but create neither tag nor release.
        required: false
        default: false
        type: boolean
      draft:
        description: Create the release as draft; a maintainer publishes it after review.
        required: false
        default: true
        type: boolean
      create-tag:
        description: >-
          Create an annotated tag on the verified commit before the release is created. When false,
          GitHub creates the tag when the draft is published.
        required: false
        default: true
        type: boolean
      tag-pattern:
        description: Extended regular expression the tag must match. A `-` in the tag marks a pre-release.
        required: false
        default: '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
        type: string
      previous-tag:
        description: Tag the change list starts at. Default is the latest published, non-pre-release release.
        required: false
        default: ""
        type: string
      release-template:
        description: >-
          Optional release body template in the repository. `$RELEASE_TAG`, `$PREVIOUS_RELEASE_TAG`,
          `$COMMIT_SHA`, `$RELEASE_DATE`, `$ACTION_RUN_URL`, `$DOCS_URL`, `$COMPARE_URL` and
          `$REPOSITORY` are substituted. Skipped when the file does not exist.
        required: false
        default: .github/RELEASE_TEMPLATE.md
        type: string
      generate-notes:
        description: Append the notes generated by GitHub (merged PRs, contributors, full changelog link).
        required: false
        default: true
        type: boolean
      docs-bazel-target:
        description: >-
          Bazel target (and flags) that builds the documentation, e.g. `//:docs`. The HTML is attached as
          `<repo>-<tag>-docs.zip`. Empty disables the docs build.
        required: false
        default: ""
        type: string
      docs-tests-report-artifact:
        description: Artifact with test reports of the calling workflow, forwarded to the docs build.
        required: false
        default: ""
        type: string
      artifact-name:
        description: >-
          Artifact uploaded by an earlier job of the calling workflow run; bundle everything to attach into
          one. It is attached as `<repo>-<tag>-<artifact-name>.zip`. Empty disables the download.
        required: false
        default: ""
        type: string
      bazel-asset-targets:
        description: >-
          Whitespace-separated Bazel targets (e.g. SBOMs) whose output files are attached to the release.
          Empty disables the Bazel step.
        required: false
        default: ""
        type: string
      bazel-flags:
        description: Flags for building and querying `bazel-asset-targets`.
        required: false
        default: ""
        type: string
      checksums:
        description: Attach a `SHA256SUMS.txt` for all assets.
        required: false
        default: true
        type: boolean
      retention-days:
        description: Retention of the workflow artifacts (assets for dry-run inspection, docs build).
        required: false
        default: 30
        type: number
    outputs:
      tag:
        description: The release tag.
        value: ${{ jobs.prepare.outputs.tag }}
      previous-tag:
        description: Tag the change list starts at; empty if there is none.
        value: ${{ jobs.prepare.outputs.previous-tag }}
      release-url:
        description: URL of the created release; empty on dry-run.
        value: ${{ jobs.release.outputs.url }}

jobs:
  prepare:
    name: Prepare release
    runs-on: ${{ vars.runner_labels_ghub24_standard_x64 && fromJSON(vars.runner_labels_ghub24_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-24.04' }}
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      previous-tag: ${{ steps.meta.outputs.previous_tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      date: ${{ steps.meta.outputs.date }}
    steps:
      - name: Validate tag and resolve metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TAG_PATTERN: ${{ inputs.tag-pattern }}
          PREVIOUS_TAG: ${{ inputs.previous-tag }}
          DRY_RUN: ${{ inputs.dry-run }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Dry runs may use any branch, e.g. to test this workflow before it is merged.
          # Compare the full ref: a tag named like the default branch has the same ref_name.
          if [[ "$DRY_RUN" != "true" && "$REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Real releases must run on 'refs/heads/$DEFAULT_BRANCH', not '$REF'. Use a dry run."
            exit 1
          fi

          if ! [[ "$TAG" =~ $TAG_PATTERN ]]; then
            echo "::error::Tag '$TAG' does not match '$TAG_PATTERN'."
            exit 1
          fi

          # matching-refs is a prefix match, so compare the full ref name.
          # Capture first: `grep -q` closing the pipe early would fail the pipeline under pipefail.
          refs="$(gh api "repos/${GH_REPO}/git/matching-refs/tags/${TAG}" --jq '.[].ref')"
          if grep -qx "refs/tags/${TAG}" <<< "$refs"; then
            echo "::error::Tag '$TAG' already exists."
            exit 1
          fi

          if [[ -z "$PREVIOUS_TAG" ]]; then
            PREVIOUS_TAG="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 \
              --json tagName --jq '.[0].tagName // ""')"
          fi

          PRERELEASE=false
          [[ "$TAG" == *-* ]] && PRERELEASE=true

          {
            echo "tag=$TAG"
            echo "previous_tag=$PREVIOUS_TAG"
            echo "prerelease=$PRERELEASE"
            echo "date=$(date -u +%F)"
          } >> "$GITHUB_OUTPUT"

  docs:
    name: Build documentation
    needs: [prepare]
    if: inputs.docs-bazel-target != ''
    permissions:
      contents: read
    uses: eclipse-score/cicd-workflows/.github/workflows/docs.yml@58cb0ec5a80441d593464d3af09d634ab91247e0 # v0.0.3-32-g8ab7396
    with:
      bazel-target: ${{ inputs.docs-bazel-target }}
      tests-report-artifact: ${{ inputs.docs-tests-report-artifact }}
      retention-days: ${{ inputs.retention-days }}

  release:
    name: Create ${{ inputs.dry-run && 'dry-run' || (inputs.draft && 'draft release' || 'release') }}
    needs: [prepare, docs]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.docs.result == 'success' || needs.docs.result == 'skipped') }}
    runs-on: ${{ vars.runner_labels_ghub24_standard_x64 && fromJSON(vars.runner_labels_ghub24_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-24.04' }}
    permissions:
      contents: write # create the tag and the release
    outputs:
      url: ${{ steps.release.outputs.url }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      REPO_NAME: ${{ github.event.repository.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Bazel with shared caching
        if: inputs.bazel-asset-targets != ''
        uses: eclipse-score/cicd-actions/setup-bazel-cache@e2a2a587a759b681632040ec1e1294015a0405f5 # setup-bazel-cache/v0.1.0
        with:
          disk-cache-key: ${{ github.job }}

      # Needs bazel on PATH: the action resolves `bazel info install_base`.
      - name: Unblock user namespaces for the Linux sandbox
        if: inputs.bazel-asset-targets != ''
        uses: eclipse-score/cicd-actions/unblock-user-namespace-for-linux-sandbox@168b6f51b21b5f0ebe49808939db53557dca410c # main branch (2026-10-12)

      - name: Build Bazel assets
        if: inputs.bazel-asset-targets != ''
        env:
          TARGETS: ${{ inputs.bazel-asset-targets }}
          FLAGS: ${{ inputs.bazel-flags }}
        run: |
          set -euo pipefail
          # Word splitting is intended: both inputs are whitespace-separated lists.
          read -r -a flags <<< "$FLAGS"
          read -r -a targets <<< "${TARGETS//$'\n'/ }"

          bazel build "${flags[@]}" "${targets[@]}"

          mkdir -p dist
          # cquery takes one expression; adjacent labels are not one.
          bazel cquery "${flags[@]}" --output=files "set(${targets[*]})" | while read -r file; do
            cp -L -- "$file" "dist/${REPO_NAME}-${TAG}-$(basename "$file")"
          done

      # By name, not pattern: a pattern matching one artifact is extracted without its own directory.
      - name: Download artifact of the calling workflow
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: artifacts/${{ inputs.artifact-name }}

      - name: Download documentation
        if: inputs.docs-bazel-target != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: artifacts/docs

      - name: Archive artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            (cd "$dir" && zip -qr "${GITHUB_WORKSPACE}/dist/${REPO_NAME}-${TAG}-${name}.zip" .)
          done

      - name: Create checksums
        if: inputs.checksums
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=(*)
          if (( ${#files[@]} > 0 )); then
            sha256sum -- "${files[@]}" > SHA256SUMS.txt
          fi

      - name: Upload assets as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ needs.prepare.outputs.tag }}
          path: dist
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: warn

      - name: Render release body
        env:
          TEMPLATE: ${{ inputs.release-template }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PREVIOUS_RELEASE_TAG: ${{ needs.prepare.outputs.previous-tag }}
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_DATE: ${{ needs.prepare.outputs.date }}
          ACTION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          # Pages URL of the tagged docs; they are published once the release is published.
          export DOCS_URL="https://${OWNER}.github.io/${REPO_NAME}/${RELEASE_TAG}/"
          if [[ -n "$PREVIOUS_RELEASE_TAG" ]]; then
            export COMPARE_URL="${SERVER_URL}/${REPOSITORY}/compare/${PREVIOUS_RELEASE_TAG}...${RELEASE_TAG}"
          else
            export COMPARE_URL=""
          fi
          export PREVIOUS_RELEASE_TAG="${PREVIOUS_RELEASE_TAG:-N/A}"
          export RELEASE_TAG COMMIT_SHA RELEASE_DATE ACTION_RUN_URL REPOSITORY

          if [[ -f "$TEMPLATE" ]]; then
            envsubst '$RELEASE_TAG $PREVIOUS_RELEASE_TAG $COMMIT_SHA $RELEASE_DATE $ACTION_RUN_URL $DOCS_URL $COMPARE_URL $REPOSITORY' \
              < "$TEMPLATE" > release_body.md
          else
            : > release_body.md
          fi

      - name: Create annotated tag
        if: ${{ !inputs.dry-run && inputs.create-tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag_object="$(gh api "repos/${GH_REPO}/git/tags" \
            -f tag="$TAG" -f message="Release $TAG" -f object="$SHA" -f type=commit --jq .sha)"
          gh api "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$tag_object" > /dev/null

      - name: Create release
        id: release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          DRAFT: ${{ inputs.draft }}
          CREATE_TAG: ${{ inputs.create-tag }}
          GENERATE_NOTES: ${{ inputs.generate-notes }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous-tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          args=("$TAG" --title "$TAG")
          [[ "$DRAFT" == "true" ]] && args+=(--draft)
          [[ "$PRERELEASE" == "true" ]] && args+=(--prerelease)

          # A draft has no tag until it is published: pin it to the verified commit.
          if [[ "$CREATE_TAG" == "true" ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "$SHA")
          fi

          if [[ -s release_body.md ]]; then
            args+=(--notes-file release_body.md)
          elif [[ "$GENERATE_NOTES" != "true" ]]; then
            args+=(--notes "")
          fi
          if [[ "$GENERATE_NOTES" == "true" ]]; then
            args+=(--generate-notes)
            [[ -n "$PREVIOUS_TAG" ]] && args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi

          url="$(gh release create "${args[@]}" dist/*)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          DRAFT: ${{ inputs.draft }}
          CREATE_TAG: ${{ inputs.create-tag }}
          URL: ${{ steps.release.outputs.url }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "### Release ${TAG}"
            echo ""
            echo "- Commit: \`${SHA}\`"
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "- **Dry run**: no tag or release created. Assets are in the \`release-assets-${TAG}\` workflow artifact."
            else
              [[ "$CREATE_TAG" == "true" ]] && echo "- Tag \`${TAG}\` created on the commit above."
              [[ -n "$URL" ]] && echo "- Release: ${URL}"
              [[ "$DRAFT" == "true" ]] && echo "- Review the draft and publish it; publishing triggers the tagged documentation deployment."
            fi
            echo ""
            if [[ -d dist ]]; then
              echo "#### Assets"
              (cd dist && ls -1 | sed 's/^/- /')
            fi
          } >> "$GITHUB_STEP_SUMMARY"

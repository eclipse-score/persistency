name: Release Core

# Assembles a DRAFT GitHub release from an already verified commit: validates the
# tag, collects assets (docs, SBOM, reports), renders the release body, tags the
# commit and runs `gh release create`.
# Called by release.yml, which owns the verification jobs. Free of persistency
# specifics so it can be proposed to eclipse-score/cicd-workflows later; inputs
# are added when a caller needs them.
#
# Tagged docs are not published here: publishing the draft fires `release: published`,
# which docs.yml turns into a deployment under /<tag>/. A release created with
# GITHUB_TOKEN triggers no other workflow, but publishing it manually does.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag in the form vX.Y.Z. Must not exist yet.
        required: true
        type: string
      dry-run:
        description: Build and collect all assets, but create neither tag nor release.
        required: false
        default: false
        type: boolean
      docs-artifact-name:
        description: >-
          Artifact of the calling workflow run with the built documentation, attached as
          `<repo>-<tag>-docs.zip`. Empty disables it.
        required: false
        default: ""
        type: string
      artifact-name:
        description: >-
          Artifact uploaded by an earlier job of the calling workflow run; bundle everything to attach into
          one. It is attached as `<repo>-<tag>-<type>.zip`: the artifact name without a leading `<repo>_`.
          Empty disables the download.
        required: false
        default: ""
        type: string
      bazel-asset-targets:
        description: >-
          Whitespace-separated Bazel targets (e.g. SBOMs) whose output files are attached to the release.
          Empty disables the Bazel step.
        required: false
        default: ""
        type: string
      bazel-flags:
        description: Flags for building and querying `bazel-asset-targets`.
        required: false
        default: ""
        type: string

jobs:
  validate:
    name: Validate tag
    runs-on: ${{ vars.runner_labels_ghub24_standard_x64 && fromJSON(vars.runner_labels_ghub24_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-24.04' }}
    permissions:
      contents: read
    steps:
      - name: Validate tag and ref
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry-run }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Dry runs may use any branch, e.g. to test this workflow before it is merged.
          # Compare the full ref: a tag named like the default branch has the same ref_name.
          if [[ "$DRY_RUN" != "true" && "$REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Real releases must run on 'refs/heads/$DEFAULT_BRANCH', not '$REF'. Use a dry run."
            exit 1
          fi

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not have the form vX.Y.Z."
            exit 1
          fi

          # matching-refs is a prefix match, so compare the full ref name.
          # Capture first: `grep -q` closing the pipe early would fail the pipeline under pipefail.
          refs="$(gh api "repos/${GH_REPO}/git/matching-refs/tags/${TAG}" --jq '.[].ref')"
          if grep -qx "refs/tags/${TAG}" <<< "$refs"; then
            echo "::error::Tag '$TAG' already exists."
            exit 1
          fi

  release:
    name: Create ${{ inputs.dry-run && 'dry-run' || 'draft release' }}
    needs: [validate]
    runs-on: ${{ vars.runner_labels_ghub24_standard_x64 && fromJSON(vars.runner_labels_ghub24_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-24.04' }}
    permissions:
      contents: write # create the tag and the release
    env:
      TAG: ${{ inputs.tag }}
      REPO_NAME: ${{ github.event.repository.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bazel with shared caching
        if: inputs.bazel-asset-targets != ''
        uses: eclipse-score/cicd-actions/setup-bazel-cache@e2a2a587a759b681632040ec1e1294015a0405f5 # setup-bazel-cache/v0.1.0
        with:
          disk-cache-key: ${{ github.job }}

      # Needs bazel on PATH: the action resolves `bazel info install_base`.
      - name: Unblock user namespaces for the Linux sandbox
        if: inputs.bazel-asset-targets != ''
        uses: eclipse-score/cicd-actions/unblock-user-namespace-for-linux-sandbox@28233566af2525acf84b3c66cfa66ae2583e4236 # main branch (2026-10-12)

      - name: Build Bazel assets
        if: inputs.bazel-asset-targets != ''
        env:
          TARGETS: ${{ inputs.bazel-asset-targets }}
          FLAGS: ${{ inputs.bazel-flags }}
        run: |
          set -euo pipefail
          # Word splitting is intended: both inputs are whitespace-separated lists.
          read -r -a flags <<< "$FLAGS"
          read -r -a targets <<< "${TARGETS//$'\n'/ }"

          bazel build "${flags[@]}" "${targets[@]}"

          mkdir -p dist
          # cquery takes one expression; adjacent labels are not one.
          bazel cquery "${flags[@]}" --output=files "set(${targets[*]})" | while read -r file; do
            cp -L -- "$file" "dist/${REPO_NAME}-${TAG}-$(basename "$file")"
          done

      # By name, not pattern: a pattern matching one artifact is extracted without its own directory.
      - name: Download artifact of the calling workflow
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: artifacts/${{ inputs.artifact-name }}

      - name: Download documentation
        if: inputs.docs-artifact-name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.docs-artifact-name }}
          path: artifacts/docs

      - name: Archive artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            type="${name#"${REPO_NAME}_"}"
            (cd "$dir" && zip -qr "${GITHUB_WORKSPACE}/dist/${REPO_NAME}-${TAG}-${type}.zip" .)
          done

      - name: Create checksums
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=(*)
          if (( ${#files[@]} > 0 )); then
            sha256sum -- "${files[@]}" > SHA256SUMS.txt
          fi

      - name: Upload assets as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ inputs.tag }}
          path: dist
          retention-days: 30
          if-no-files-found: warn

      - name: Resolve previous release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Render release body
        env:
          TEMPLATE: .github/RELEASE_TEMPLATE.md
          RELEASE_TAG: ${{ inputs.tag }}
          PREVIOUS_RELEASE_TAG: ${{ steps.previous.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
          ACTION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          # Pages URL of the tagged docs; they are published once the release is published.
          export DOCS_URL="https://${OWNER}.github.io/${REPO_NAME}/${RELEASE_TAG}/"
          if [[ -n "$PREVIOUS_RELEASE_TAG" ]]; then
            export COMPARE_URL="${SERVER_URL}/${REPOSITORY}/compare/${PREVIOUS_RELEASE_TAG}...${RELEASE_TAG}"
          else
            export COMPARE_URL=""
          fi
          export PREVIOUS_RELEASE_TAG="${PREVIOUS_RELEASE_TAG:-N/A}"
          export RELEASE_DATE="$(date -u +%F)"
          export RELEASE_TAG COMMIT_SHA ACTION_RUN_URL REPOSITORY

          envsubst '$RELEASE_TAG $PREVIOUS_RELEASE_TAG $COMMIT_SHA $RELEASE_DATE $ACTION_RUN_URL $DOCS_URL $COMPARE_URL $REPOSITORY' \
            < "$TEMPLATE" > release_body.md

      - name: Create annotated tag
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag_object="$(gh api "repos/${GH_REPO}/git/tags" \
            -f tag="$TAG" -f message="Release $TAG" -f object="$SHA" -f type=commit --jq .sha)"
          gh api "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$tag_object" > /dev/null

      - name: Create draft release
        id: release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          args=("$TAG" --title "$TAG" --draft --verify-tag --notes-file release_body.md --generate-notes)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi

          url="$(gh release create "${args[@]}" dist/*)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          URL: ${{ steps.release.outputs.url }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "### Release ${TAG}"
            echo ""
            echo "- Commit: \`${SHA}\`"
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "- **Dry run**: no tag or release created. Assets are in the \`release-assets-${TAG}\` workflow artifact."
            else
              echo "- Tag \`${TAG}\` created on the commit above."
              [[ -n "$URL" ]] && echo "- Draft: ${URL}"
              echo "- Review the draft and publish it; publishing triggers the tagged documentation deployment."
            fi
            echo ""
            if [[ -d dist ]]; then
              echo "#### Assets"
              (cd dist && ls -1 | sed 's/^/- /')
            fi
          } >> "$GITHUB_STEP_SUMMARY"

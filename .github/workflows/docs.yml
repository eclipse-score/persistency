# The workflow name is referenced by docs-publish.yml (workflow_run); keep both in sync.
name: Docs Build

# Unprivileged build only. Publishing happens in docs-publish.yml.
permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  release:
    types: [published]
  # Reusable by other workflows; a called run builds the docs but does not publish them.
  workflow_call:
    outputs:
      artifact-name:
        description: Artifact with the built documentation.
        value: ${{ jobs.docs.outputs.artifact-name }}

jobs:
  cit-tests:
    permissions:
      contents: read
    uses: ./.github/workflows/component_integration_tests.yml

  docs:
    needs: [cit-tests] # Test reports are needed for traceability links
    uses: eclipse-score/cicd-workflows/.github/workflows/docs.yml@096f52ab460e52b9cf5d2a89384406385df9c074 # v0.0.3-47-g6bcfd5d
    permissions:
      contents: read
    with:
      bazel-target: "--lockfile_mode=error //:docs"
      retention-days: 3
      tests-report-artifact: ${{ needs.cit-tests.outputs.artifact-name }}

  apt-mirror-smoke-test:
    name: APT mirror smoke test
    runs-on: ${{ vars.runner_labels_ghub_standard_x64 && fromJSON(vars.runner_labels_ghub_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-24.04' }}
    permissions: {}
    steps:
      - name: Configure APT mirror fallback
        run: |
          set -euo pipefail
          sources_file=/etc/apt/sources.list.d/ubuntu.sources
          mirror_list="$RUNNER_TEMP/ubuntu-mirrors.txt"

          if [[ ! -f "$sources_file" ]]; then
            echo "Expected Ubuntu sources file not found: $sources_file" >&2
            exit 1
          fi

          printf '%s\tpriority:1\n%s\tpriority:2\n' \
            'https://mirror.pilotfiber.com/ubuntu/' \
            'http://mirror.arizona.edu/ubuntu/' > "$mirror_list"

          sudo sed -i -E "s|^URIs:.*$|URIs: mirror+file:$mirror_list|" "$sources_file"
          printf 'Acquire::Retries "3";\n' |
            sudo tee /etc/apt/apt.conf.d/80-acquire-retries >/dev/null

          grep '^URIs:' "$sources_file"
          cat "$mirror_list"

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

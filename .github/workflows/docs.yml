# The workflow name is referenced by docs-publish.yml (workflow_run); keep both in sync.
name: Docs Build

# Unprivileged build only. Publishing happens in docs-publish.yml.
permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  release:
    types: [published]

jobs:
  cit-tests:
    uses: ./.github/workflows/component_integration_tests.yml

  docs:
    needs: [cit-tests] # Test reports are needed for traceability links
    uses: eclipse-score/cicd-workflows/.github/workflows/docs.yml@77760ad7cdb83fbb157dffa3ba30cc60fe0e141e # v0.0.3-28-g77760ad
    permissions:
      contents: read
    with:
      bazel-target: "--lockfile_mode=error //:docs"
      retention-days: 3
      tests-report-artifact: tests-report

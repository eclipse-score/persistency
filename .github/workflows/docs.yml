# The workflow name is referenced by docs-publish.yml (workflow_run); keep both in sync.
name: Docs Build

# Unprivileged build only. Publishing happens in docs-publish.yml.
permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  release:
    types: [published]
  # Reusable by other workflows; a called run builds the docs but does not publish them.
  workflow_call:
    outputs:
      artifact-name:
        description: Artifact with the built documentation.
        value: ${{ jobs.docs.outputs.artifact-name }}

jobs:
  cit-tests:
    permissions:
      contents: read
    uses: ./.github/workflows/component_integration_tests.yml

  docs:
    needs: [cit-tests] # Test reports are needed for traceability links
    uses: eclipse-score/cicd-workflows/.github/workflows/docs.yml@6bcfd5dabc202bf1237d34c90bad5dda6f0f0629 # v0.0.3-47-g6bcfd5d
    permissions:
      contents: read
    with:
      bazel-target: "--lockfile_mode=error //:docs"
      retention-days: 3
      tests-report-artifact: ${{ needs.cit-tests.outputs.artifact-name }}

name: Docs Publish

# Privileged publishing of the artifact built by the unprivileged "Documentation CI" workflow.
on:
  workflow_run:
    workflows: ["Docs Build"] # must match the name in docs.yml
    types: [completed]

jobs:
  docs-publish:
    if: github.event.workflow_run.conclusion == 'success'
    uses: eclipse-score/cicd-workflows/.github/workflows/docs-publish.yml@2396c21ed424744a3df4e1d0aa66cd8de9b947e7 # v0.0.3-43-7e8ea4c
    permissions:
      actions: read
      contents: write
      id-token: write
      pages: write
      pull-requests: write

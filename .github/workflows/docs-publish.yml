name: Docs Publish

# Privileged publishing of the artifact built by the unprivileged "Docs Build" workflow.
on:
  workflow_run:
    workflows: ["Docs Build"] # must match the name in docs.yml
    types: [completed]

jobs:
  docs-publish:
    if: github.event.workflow_run.conclusion == 'success'
    uses: eclipse-score/cicd-workflows/.github/workflows/docs-publish.yml@32d0b258660d17e749a41760d4e40f3991bec0a2 # main (2026-11-27)
    permissions:
      actions: read
      contents: write
      id-token: write
      pages: write
      pull-requests: write
    # Same group as daily.yml.
    # Both jobs write gh-pages.
    concurrency:
      group: docs-publish
      cancel-in-progress: false
      queue: max
    with:
      runner-labels: ${{ vars.runner_labels_ghub24_standard_x64 || '"ubuntu-24.04"' }}

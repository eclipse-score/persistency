name: Release
run-name: Release ${{ inputs.tag }}${{ inputs.dry_run && ' (dry run)' || '' }}

# Manual trigger. Verifies the dispatched commit, then creates a DRAFT release
# (tag, verification report, docs, SBOM, notes). The module lead reviews and
# publishes the draft; publishing triggers the tagged docs deployment (docs.yml).
# dry_run=true runs everything but creates neither tag nor release.
#
# Precondition (release management process, gd_guidl__rel_management): the module
# release note docs/module/release/release_note.rst names the tag and its PR was
# approved by a project lead. A real release refuses to start otherwise.
#
# Publishing the draft also adds the version to eclipse-score/bazel_registry within
# about 30 minutes (periodic-pull); pre-releases included, so never publish test releases.
# If it does not appear, run "Check for Module Updates" there with module score_persistency.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.4.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run: validate build/test/coverage/docs without creating tag or release"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-note:
    name: Check module release note
    runs-on: ${{ vars.runner_labels_ghub24_standard_x64 && fromJSON(vars.runner_labels_ghub24_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-24.04' }}
    permissions:
      contents: read
    steps:
      - name: Release note names the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_NOTE: docs/module/release/release_note.rst
        run: |
          set -euo pipefail
          note="$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GH_REPO}/contents/${RELEASE_NOTE}?ref=${SHA}")"
          if grep -qxF "| **Release Tag:** ${TAG}" <<< "$note"; then
            exit 0
          fi
          msg="$RELEASE_NOTE does not name release tag '$TAG'. Merge the approved release note first."
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "::warning::$msg"
          else
            echo "::error::$msg"
            exit 1
          fi

  build-test:
    name: Build and unit tests
    # Fail fast: a real run without release note must not spend the verification time.
    needs: [release-note]
    runs-on: ${{ vars.runner_labels_ghub24_standard_x64 && fromJSON(vars.runner_labels_ghub24_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-24.04' }}
    permissions:
      contents: read
    steps:
      - uses: eclipse-score/more-disk-space@beee38c3b4426a7c43fdfeb2495d1af812179c3e # v1.3.0
        with:
          level: 4

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bazel with shared caching
        uses: eclipse-score/cicd-actions/setup-bazel-cache@e2a2a587a759b681632040ec1e1294015a0405f5 # setup-bazel-cache/v0.1.0
        with:
          disk-cache-key: ${{ github.job }}

      # Needs bazel on PATH: the action resolves `bazel info install_base`.
      - uses: eclipse-score/cicd-actions/unblock-user-namespace-for-linux-sandbox@28233566af2525acf84b3c66cfa66ae2583e4236 # main branch (2026-10-12)

      - name: Build via Bazel
        run: |
          set -euo pipefail
          bazel build --lockfile_mode=error --config=score-linux-x86_64 //score/...

      - name: Run Unit Tests via Bazel
        run: |
          set -euo pipefail
          bazel test --lockfile_mode=error --config=score-linux-x86_64 //:unit_tests

  coverage:
    needs: [release-note]
    permissions:
      contents: read
    uses: ./.github/workflows/coverage.yml

  cit-and-docs:
    # The docs workflow runs the component integration tests first; their report is input of the docs build.
    needs: [release-note]
    permissions:
      contents: read
    uses: ./.github/workflows/docs.yml

  release:
    needs: [release-note, build-test, coverage, cit-and-docs]
    uses: ./.github/workflows/release_core.yml
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag }}
      dry-run: ${{ inputs.dry_run }}
      artifact-name: ${{ needs.coverage.outputs.artifact-name }}
      docs-artifact-name: ${{ needs.cit-and-docs.outputs.artifact-name }}
      bazel-asset-targets: //:sbom_product
      bazel-flags: --lockfile_mode=error --config=score-linux-x86_64

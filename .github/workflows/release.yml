name: Release
run-name: Release ${{ inputs.tag }}${{ inputs.dry_run && ' (dry run)' || '' }}

# Manual trigger. Verifies the dispatched commit, then creates a DRAFT release
# (tag, verification report, docs, SBOM, notes). A maintainer reviews and
# publishes the draft; publishing triggers the tagged docs deployment (docs.yml).
# dry_run=true runs everything but creates neither tag nor release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.4.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run: validate build/test/coverage/docs without creating tag or release"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Build, test and coverage
    runs-on: ${{ vars.runner_labels_ghub24_standard_x64 && fromJSON(vars.runner_labels_ghub24_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-24.04' }}
    permissions:
      contents: read
    steps:
      - uses: eclipse-score/more-disk-space@beee38c3b4426a7c43fdfeb2495d1af812179c3e # v1.3.0
        with:
          level: 4

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Bazel with shared caching
        uses: eclipse-score/cicd-actions/setup-bazel-cache@e2a2a587a759b681632040ec1e1294015a0405f5 # setup-bazel-cache/v0.1.0
        with:
          disk-cache-key: ${{ github.job }}

      # Needs bazel on PATH: the action resolves `bazel info install_base`.
      - uses: eclipse-score/cicd-actions/unblock-user-namespace-for-linux-sandbox@168b6f51b21b5f0ebe49808939db53557dca410c # main branch (2026-10-12)

      - name: Build via Bazel
        run: |
          set -euo pipefail
          bazel build --lockfile_mode=error --config=score-linux-x86_64 //score/...

      - name: Run Unit Tests via Bazel
        run: |
          set -euo pipefail
          bazel test --lockfile_mode=error --config=score-linux-x86_64 //:unit_tests

      - name: Run unified Rust + C++ coverage
        run: |
          set -euo pipefail
          bazel coverage --lockfile_mode=error --config=llvm_cov \
            //score/... --build_tests_only

      - name: Generate unified coverage report
        env:
          # Report-only; see coverage.yml for the rationale on this threshold.
          COVERAGE_THRESHOLD: "0"
        run: |
          set -euo pipefail
          bazel run --lockfile_mode=error @score_coverage//:generate_coverage_html -- \
            --yaml quality/coverage/coverage_justifications.yaml \
            --testlogs-subdir score \
            --archive-dir coverage_artifact

      - name: Collect verification report
        run: |
          set -euo pipefail
          mkdir -p verification-report
          find bazel-testlogs/score/ -name 'test.xml' -print0 | xargs -0 -I{} cp --parents {} verification-report/
          cp -r coverage_artifact verification-report/

      - name: Upload verification report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-report
          path: verification-report

  cit:
    # Its test report is traceability input of the docs build.
    permissions:
      contents: read
    uses: ./.github/workflows/component_integration_tests.yml

  release:
    needs: [verify, cit]
    uses: ./.github/workflows/release_core.yml
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag }}
      dry-run: ${{ inputs.dry_run }}
      artifact-name: verification-report
      docs-bazel-target: "--lockfile_mode=error //:docs"
      docs-tests-report-artifact: tests-report
      bazel-asset-targets: //:sbom_product
      bazel-flags: --lockfile_mode=error --config=score-linux-x86_64

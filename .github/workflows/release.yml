#
# Builds and verifies a release candidate.
# It reuses the repository's build, cargo, coverage, lint and sanitizer workflows.
# Then it creates a draft release from .github/RELEASE_TEMPLATE.md.
# Maintainers review and publish the draft.
# Publishing the draft creates the tag and triggers docs.yml for it.
name: Release
run-name: Release ${{ inputs.tag }}${{ inputs.dry_run && ' (dry run)' || '' }}

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z, e.g. v0.3.6)"
        required: true
        type: string
      dry_run:
        description: "Dry run: run all checks and build the release assets, but don't create the draft release"
        required: false
        type: boolean
        default: true

concurrency:
  group: release

jobs:
  validate:
    runs-on: ${{ vars.runner_labels_ghub24_standard_x64 && fromJSON(vars.runner_labels_ghub24_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-24.04' }}
    steps:
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag '${RELEASE_TAG}'. Use vX.Y.Z."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > /dev/null 2>&1; then
            echo "::error::Tag '${RELEASE_TAG}' already exists."
            exit 1
          fi

  build-linux:
    needs: validate
    uses: ./.github/workflows/build_linux.yml
    permissions:
      contents: read
  build-qnx:
    needs: validate
    uses: ./.github/workflows/build_qnx.yml
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit
  cargo:
    needs: validate
    uses: ./.github/workflows/cargo_required.yml
    permissions:
      contents: read
  coverage-report:
    needs: validate
    uses: ./.github/workflows/coverage_report.yml
    permissions:
      contents: read
  lint:
    needs: validate
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
  sanitizers:
    needs: validate
    uses: ./.github/workflows/sanitizers_linux.yml
    permissions:
      contents: read

  sbom:
    needs: validate
    runs-on: ${{ vars.runner_labels_ghub24_standard_x64 && fromJSON(vars.runner_labels_ghub24_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-24.04' }}
    steps:
      - name: Free up disk space
        uses: eclipse-score/more-disk-space@beee38c3b4426a7c43fdfeb2495d1af812179c3e # v1.3.0
        with:
          level: 4
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Setup Bazel with shared caching
        uses: eclipse-score/cicd-actions/setup-bazel-cache@e2a2a587a759b681632040ec1e1294015a0405f5 # setup-bazel-cache/v0.1.0
        with:
          disk-cache-key: ${{ github.job }}
      # Needs bazel on PATH: the action resolves `bazel info install_base`.
      - uses: eclipse-score/cicd-actions/unblock-user-namespace-for-linux-sandbox@168b6f51b21b5f0ebe49808939db53557dca410c # main branch (2026-10-12)
      # Needs network access: crate metadata comes from the crates.io API.
      - name: Build SBOM
        run: bazel build --lockfile_mode=error --config=score-linux-x86_64 //:sbom_product
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            bazel-bin/sbom_product.spdx.json
            bazel-bin/sbom_product.cdx.json
          if-no-files-found: error

  create-release:
    needs: [build-linux, build-qnx, cargo, coverage-report, lint, sanitizers, sbom]
    runs-on: ${{ vars.runner_labels_ghub24_standard_x64 && fromJSON(vars.runner_labels_ghub24_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-24.04' }}
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run }}
      COVERAGE_ARCHIVE: ${{ github.event.repository.name }}-${{ inputs.tag }}-coverage
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get Current Date and Previous Release Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS_TAG=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || echo "N/A")
          echo "RELEASE_DATE=$(date --rfc-3339=date)" >> "$GITHUB_ENV"
          echo "PREVIOUS_RELEASE_TAG=$PREVIOUS_TAG" >> "$GITHUB_ENV"
      - name: Generate Release Body
        env:
          COMMIT_SHA: ${{ github.sha }}
          ACTION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          envsubst '$RELEASE_TAG $PREVIOUS_RELEASE_TAG $COMMIT_SHA $RELEASE_DATE $ACTION_RUN_URL' < .github/RELEASE_TEMPLATE.md > release_body.md
      - name: Download Coverage Report Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.event.repository.name }}_coverage_report
          path: ${{ env.COVERAGE_ARCHIVE }}
      - name: Create Coverage Report Archive
        run: |
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -cJf "$COVERAGE_ARCHIVE.tar.xz" "$COVERAGE_ARCHIVE"
      - name: Download SBOM Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom
      - name: Upload Release Assets (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: |
            release_body.md
            ${{ env.COVERAGE_ARCHIVE }}.tar.xz
            sbom/
      - name: Create Draft Release
        if: ${{ !inputs.dry_run }}
        id: draft_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          body_path: release_body.md
          draft: true
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          files: |
            ${{ env.COVERAGE_ARCHIVE }}.tar.xz
            sbom/sbom_product.spdx.json
            sbom/sbom_product.cdx.json
      - name: Summary
        env:
          RELEASE_URL: ${{ steps.draft_release.outputs.url }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "### Release Dry Run :test_tube:"
              echo "No draft release was created. The release body and assets are in the \`release-dry-run\` artifact."
            else
              echo "### Draft Release Created :rocket:"
              echo "Maintainers can review at: ${RELEASE_URL}"
            fi
            echo "Tag: **${RELEASE_TAG}**"
            echo "Branch: \`${REF_NAME}\`"
            echo "Commit: \`${COMMIT_SHA}\`"
            echo "Next step after publishing: update the S-CORE Bazel registry (\`eclipse-score/bazel_registry\`) for ${RELEASE_TAG}."
          } >> "$GITHUB_STEP_SUMMARY"

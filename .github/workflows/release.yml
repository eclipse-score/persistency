name: Release
run-name: Release ${{ inputs.tag }}${{ inputs.dry_run && ' (dry run)' || '' }}

# Manual trigger. Verifies the dispatched commit, then creates a DRAFT release
# (tag, verification report, docs, SBOM, notes). The module lead reviews and
# publishes the draft; publishing triggers the tagged docs deployment (docs.yml).
# dry_run=true runs everything but creates neither tag nor release.
#
# Precondition (release management process, gd_guidl__rel_management): the module
# release note docs/module/release/release_note.rst names the tag and its PR was
# approved by a project lead. A real release refuses to start otherwise.
#
# Publishing the draft also adds the version to eclipse-score/bazel_registry within
# about 30 minutes (periodic-pull); pre-releases included, so never publish test releases.
# If it does not appear, run "Check for Module Updates" there with module score_persistency.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.4.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run: validate build/test/coverage/docs without creating tag or release"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  precheck:
    permissions:
      contents: read
    uses: ./.github/workflows/release_precheck.yml
    with:
      tag: ${{ inputs.tag }}
      dry-run: ${{ inputs.dry_run }}

  # Check the tag and release notes before spending time on builds and tests.
  # The checks reuse the pull request workflows, so a release verifies the same as CI.
  build-linux:
    needs: [precheck]
    permissions:
      contents: read
    uses: ./.github/workflows/build_linux.yml

  build-qnx:
    needs: [precheck]
    permissions:
      contents: read
    secrets: inherit
    uses: ./.github/workflows/build_qnx.yml

  cargo:
    needs: [precheck]
    permissions:
      contents: read
    uses: ./.github/workflows/cargo_required.yml

  lint:
    needs: [precheck]
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  sanitizers:
    needs: [precheck]
    permissions:
      contents: read
    uses: ./.github/workflows/sanitizers_linux.yml

  coverage:
    needs: [precheck]
    permissions:
      contents: read
    uses: ./.github/workflows/coverage_report.yml

  cit-and-docs:
    # Docs runs the component integration tests and includes their results in the documentation.
    needs: [precheck]
    permissions:
      contents: read
    uses: ./.github/workflows/docs.yml

  release:
    needs: [precheck, build-linux, build-qnx, cargo, lint, sanitizers, coverage, cit-and-docs]
    uses: ./.github/workflows/release_execution.yml
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag }}
      dry-run: ${{ inputs.dry_run }}
      artifact-name: ${{ needs.coverage.outputs.artifact-name }}
      docs-artifact-name: ${{ needs.cit-and-docs.outputs.artifact-name }}
      bazel-asset-targets: //:sbom_product
      bazel-flags: --lockfile_mode=error --config=score-linux-x86_64

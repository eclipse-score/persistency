name: CodeQL

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '0 2 * * 1' # weekly, also catches new CodeQL queries without code changes

jobs:
  # C++: MISRA C++:2023 query pack via the shared S-CORE workflow.
  # Local spawn strategy and no action cache, so that CodeQL traces every compiler call.
  codeql-cpp:
    uses: eclipse-score/cicd-workflows/.github/workflows/codeql.yml@8ab73967470fa41977dd1c1102d03719b2e2c7e2 # v0.0.3-32-g8ab7396
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    with:
      build-script: >-
        bazel build --config=per-x86_64-linux --lockfile_mode=error
        --spawn_strategy=local --nouse_action_cache --noremote_accept_cached
        //score/kvs:kvs

  # Rust: CodeQL default code scanning suite, extracted from the Cargo workspace without a build.
  codeql-rust:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: rust
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:rust"

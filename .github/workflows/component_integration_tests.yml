name: Component Integration Tests

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_call:
    outputs:
      artifact-name:
        description: Name of the uploaded XML and log report for downstream jobs, or empty if no files were uploaded.
        value: ${{ jobs.component-integration-tests.outputs.artifact-name }}

jobs:
  component-integration-tests:
    uses: eclipse-score/cicd-workflows/.github/workflows/bazel.yml@d241348e8670bf5b8902d67ff3ac77e7f60f9ec7 # main (2026-11-11)
    permissions:
      contents: read
    with:
      test-targets: //:cit_tests
      bazel-configs: score-linux-x86_64
      cache-key: component-integration-tests
      # Docs downloads these test results through the artifact-name output above.
      artifact-name: tests-report

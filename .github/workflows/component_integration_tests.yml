name: Component Integration Tests

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_call:
    outputs:
      artifact-name:
        description: Artifact with the test reports (test.xml and test.log files).
        value: ${{ jobs.component-integration-tests.outputs.artifact-name }}

jobs:
  component-integration-tests:
    uses: eclipse-score/cicd-workflows/.github/workflows/bazel.yml@bazel-workflow
    permissions:
      contents: read
    with:
      test-targets: //:cit_tests
      bazel-args: --lockfile_mode=error --config=score-linux-x86_64
      cache-key: component-integration-tests
      artifact-name: tests-report

name: Component Integration Tests

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_call:
    outputs:
      artifact-name:
        description: Artifact with the test reports (test.xml and test.log files).
        value: ${{ jobs.component-integration-tests.outputs.artifact-name }}

jobs:
  component-integration-tests:
    runs-on: ${{ vars.runner_labels_ghub24_standard_x64 && fromJSON(vars.runner_labels_ghub24_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-24.04' }}
    permissions:
      contents: read
    env:
      ARTIFACT_NAME: tests-report
    outputs:
      artifact-name: ${{ env.ARTIFACT_NAME }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: eclipse-score/more-disk-space@beee38c3b4426a7c43fdfeb2495d1af812179c3e # v1.3.0

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bazel with shared caching
        uses: eclipse-score/cicd-actions/setup-bazel-cache@e2a2a587a759b681632040ec1e1294015a0405f5 # setup-bazel-cache/v0.1.0
        with:
          disk-cache-key: ${{ github.job }}

      # Needs bazel on PATH: the action resolves `bazel info install_base`.
      - uses: eclipse-score/cicd-actions/unblock-user-namespace-for-linux-sandbox@f540b4ba52b0ea29cd81e5a5b80b2088a39dfb98 # main branch (2026-10-12)

      # Test scenarios run in a Docker container started by ITF.
      - name: Run Python tests with bazel
        run: |
          bazel test --lockfile_mode=error --config=score-linux-x86_64 //:cit_tests

      - name: Prepare test reports
        if: always()
        # Creating tests-report directory
        # Follow Symlinks via '-L' to copy correctly
        # Copy everything inside the 'test-reports' folder
        run: |
          mkdir -p tests-report
          rsync -amL --include='*/' --include='test.xml' --include='test.log' --exclude='*' bazel-testlogs/ tests-report/

      - name: Upload bundled test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: tests-report

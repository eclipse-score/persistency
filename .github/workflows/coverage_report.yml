name: Code Coverage
permissions:
  contents: read
# pr.yml calls this workflow on pull requests and merge groups.
# release.yml and cache-maintenance.yml also call it.
on:
  workflow_call:
    outputs:
      artifact-name:
        description: Artifact with the complete coverage archive (reports and justifications).
        value: ${{ jobs.coverage-report.outputs.artifact-name }}
  workflow_dispatch:
jobs:
  coverage-scope:
    name: Coverage scope
    runs-on: ${{ vars.runner_labels_ghub24_standard_x64 && fromJSON(vars.runner_labels_ghub24_standard_x64) || 'ubuntu-24.04' }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bazel with shared caching
        uses: eclipse-score/cicd-actions/setup-bazel-cache@d8f1ca7808fe21b755ef3277d3581a1d57dec15f # setup-bazel-cache/v0.2.0
        with:
          disk-cache-key: ${{ github.job }}
          # The check runs no actions, so it needs no disk cache.
          disk-cache-restore: false
          disk-cache-save: false
      # The check runs bazel query and cquery only, so it needs no sandbox.
      - name: Check coverage scope completeness
        run: ./.github/tools/check_coverage_scope.sh

  coverage-report:
    uses: eclipse-score/cicd-workflows/.github/workflows/bazel.yml@200f97be787848974e55d1f4ef5615efbaa97ff8 # main branch (2026-11-17)
    permissions:
      contents: read
    with:
      runner-labels: ${{ vars.runner_labels_ghub24_standard_x64 || '"ubuntu-24.04"' }}
      test-command: coverage
      bazel-configs: llvm_cov
      # The kvs_tool ITF tests run their binaries in a Docker container.
      # Coverage data from the container never reaches Bazel, so they are excluded.
      test-targets: //score/... -//score/kvs/rust_kvs_tool/tests/...
      test-args: --build_tests_only
      coverage-justifications: tools/coverage/coverage_justifications.yaml
      # Report-only during the introduction phase.
      # Raise it stepwise toward 100 (effective coverage with justifications).
      # Then drop the input to use the default of 100.
      coverage-threshold: 0
      cache-key: coverage-report
      disk-cleanup-level: 4
      artifact-name: ${{ github.event.repository.name }}_coverage_report
      retention-days: 10

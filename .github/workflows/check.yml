name: Check compilation and code

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]

defaults:
  run:
    shell: bash

jobs:
  cargo-build:
    runs-on: ${{ vars.runner_labels_ghub24_standard_x64 && fromJSON(vars.runner_labels_ghub24_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-24.04' }}
    permissions:
      contents: read
    steps:
      - uses: eclipse-score/more-disk-space@beee38c3b4426a7c43fdfeb2495d1af812179c3e # v1.3.0

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch (2026-10-16)
        with:
          toolchain: 1.90.0
          components: clippy, rustfmt

      - name: Cargo Build
        run: |
          cargo build

  cargo-coverage:
    runs-on: ${{ vars.runner_labels_ghub24_standard_x64 && fromJSON(vars.runner_labels_ghub24_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-24.04' }}
    permissions:
      contents: read
    steps:
      - uses: eclipse-score/more-disk-space@beee38c3b4426a7c43fdfeb2495d1af812179c3e # v1.3.0

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch (2026-10-16)
        with:
          toolchain: nightly-2025-12-15
          components: llvm-tools-preview, rust-src

      - name: Install cargo-llvm-cov
        run: |
          cargo +nightly-2025-12-15 install cargo-llvm-cov --locked

      - name: Cargo llvm-cov
        run: |
          cargo +nightly-2025-12-15 llvm-cov --branch --tests --lib

  rust-bazel:
    runs-on: ${{ vars.runner_labels_ghub24_standard_x64 && fromJSON(vars.runner_labels_ghub24_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-24.04' }}
    permissions:
      contents: read
    steps:
      - uses: eclipse-score/more-disk-space@beee38c3b4426a7c43fdfeb2495d1af812179c3e # v1.3.0

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bazel with shared caching
        uses: eclipse-score/cicd-actions/setup-bazel-cache@e2a2a587a759b681632040ec1e1294015a0405f5 # setup-bazel-cache/v0.1.0
        with:
          disk-cache-key: ${{ github.job }}

      # Needs bazel on PATH: the action resolves `bazel info install_base`.
      - uses: eclipse-score/cicd-actions/unblock-user-namespace-for-linux-sandbox@168b6f51b21b5f0ebe49808939db53557dca410c # main branch (2026-10-12)

      - name: Bazel Build
        run: |
          bazel build --lockfile_mode=error \
            --config=score-linux-x86_64 \
            //score/kvs/rust_kvs:rust_kvs \
            //score/kvs/rust_kvs_tool:kvs_tool

      - name: Bazel Unit Tests
        run: |
          bazel test --lockfile_mode=error --config=score-linux-x86_64 //score/kvs/rust_kvs:unit_tests

      - name: Bazel Miri Tests
        run: |
          bazel test --lockfile_mode=error --config=score-linux-x86_64 //score/kvs/rust_kvs:unit_tests_miri --test_output=all

  cpp-bazel:
    runs-on: ${{ vars.runner_labels_ghub24_standard_x64 && fromJSON(vars.runner_labels_ghub24_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-24.04' }}
    permissions:
      contents: read
    steps:
      - uses: eclipse-score/more-disk-space@beee38c3b4426a7c43fdfeb2495d1af812179c3e # v1.3.0

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bazel with shared caching
        uses: eclipse-score/cicd-actions/setup-bazel-cache@e2a2a587a759b681632040ec1e1294015a0405f5 # setup-bazel-cache/v0.1.0
        with:
          disk-cache-key: ${{ github.job }}

      # Needs bazel on PATH: the action resolves `bazel info install_base`.
      - uses: eclipse-score/cicd-actions/unblock-user-namespace-for-linux-sandbox@168b6f51b21b5f0ebe49808939db53557dca410c # main branch (2026-10-12)

      - name: Bazel Build
        run: bazel build --lockfile_mode=error --config=score-linux-x86_64 //score/kvs

      - name: Bazel Unit Test with Coverage
        run: |
          bazel coverage --lockfile_mode=error --config=score-linux-x86_64 //score/kvs:unit_tests \
            --collect_code_coverage \
            --combined_report=lcov \
            --experimental_generate_llvm_lcov \
            --nocache_test_results \
            --nostamp

      - name: Install lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Extract Coverage for CPP Files
        run: |
          genhtml "$(bazel info output_path)/_coverage/_coverage_report.dat" \
            -o=cpp_coverage \
            --show-details \
            --legend \
            --function-coverage \
            --branch-coverage \
            --filter branch
        shell: bash
      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event.repository.name }}_cpp_coverage_report
          path: cpp_coverage/
          retention-days: 10

name: Daily Maintenance

permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

on:
  # Runs every day at midnight UTC
  schedule:
    - cron: '0 0 * * *'

  # Manually trigger the workflow from the GitHub UI
  workflow_dispatch: {}

jobs:
  maintenance:
    uses: eclipse-score/cicd-workflows/.github/workflows/daily.yml@d31fdc0ba74985a71acbfa1e994fd45e2bbc5fad # v0.0.3-26-gd31fdc0

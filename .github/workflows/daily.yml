name: Daily Maintenance

permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write
  actions: write # prune obsolete GitHub Actions caches

on:
  # Runs every day at 03:00 UTC
  schedule:
    - cron: '0 3 * * *'

  # Manually trigger the workflow from the GitHub UI
  workflow_dispatch: {}

jobs:
  maintenance:
    uses: eclipse-score/cicd-workflows/.github/workflows/daily.yml@32d0b258660d17e749a41760d4e40f3991bec0a2 # main (2026-11-27)
    # Same group as docs-publish.yml.
    # Both jobs write gh-pages.
    concurrency:
      group: docs-publish
      cancel-in-progress: false
      queue: max
    with:
      runner-labels: ${{ vars.runner_labels_ghub24_standard_x64 || '"ubuntu-24.04"' }}

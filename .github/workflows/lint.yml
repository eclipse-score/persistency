name: Lint

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_call:

jobs:
  lint:
    uses: eclipse-score/cicd-workflows/.github/workflows/static-analysis.yml@3f61217cfa69b1d40b366049ace7fc63932e63c2 # v0.0.3-32-g8ab7396
    permissions:
      contents: read
    with:
      bazel-targets: "//..."
      bazel-config: "lint"
      bazel-args: "--lockfile_mode=error --@aspect_rules_lint//lint:fail_on_violation=true"

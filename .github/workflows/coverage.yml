name: Unified Coverage (LLVM)
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-name:
        description: Name of the uploaded coverage report for release packaging, or empty if no files were uploaded.
        value: ${{ jobs.llvm_coverage.outputs.artifact-name }}

jobs:
  llvm_coverage:
    uses: eclipse-score/cicd-workflows/.github/workflows/bazel.yml@bazel-workflow
    permissions:
      contents: read
    with:
      test-command: coverage
      bazel-configs: llvm_cov
      # Integration tests run in Docker, so Bazel cannot collect their coverage.
      test-targets: //score/... -//score/kvs/rust_kvs_tool/tests/...
      test-args: --build_tests_only
      coverage-justifications: quality/coverage/coverage_justifications.yaml
      # Collect reports without a minimum coverage percentage; test and reporter errors still fail.
      coverage-threshold: 0
      artifact-name: ${{ github.event.repository.name }}_coverage_report
      disk-space-level: 4

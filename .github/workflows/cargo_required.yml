name: Cargo build and Miri
# pr.yml calls this workflow on pull requests and merge groups.
# release.yml and cache-maintenance.yml also call it.
on:
  workflow_call:
env:
  CARGO_TERM_COLOR: always
jobs:
  cargo-build:
    name: Cargo build
    runs-on: ${{ vars.runner_labels_ghub24_standard_x64 && fromJSON(vars.runner_labels_ghub24_standard_x64) || 'ubuntu-24.04' }}
    permissions:
      contents: read
    steps:
      - uses: eclipse-score/more-disk-space@beee38c3b4426a7c43fdfeb2495d1af812179c3e # v1.3.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the Rust toolchain from rust-toolchain.toml
        id: rust-toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "${channel}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - name: Cargo build
        run: cargo build
  miri:
    name: Miri (Bazel)
    uses: eclipse-score/cicd-workflows/.github/workflows/bazel.yml@200f97be787848974e55d1f4ef5615efbaa97ff8 # main branch (2026-11-17)
    permissions:
      contents: read
    with:
      runner-labels: ${{ vars.runner_labels_ghub24_standard_x64 || '"ubuntu-24.04"' }}
      bazel-configs: score-linux-x86_64
      test-targets: //:miri_tests
      cache-key: miri
      artifact-name: miri-testlogs-${{ github.run_attempt }}

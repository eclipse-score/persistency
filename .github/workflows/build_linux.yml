name: Bazel Build (Linux)
# pr.yml calls this workflow on pull requests and merge groups.
# release.yml and cache-maintenance.yml also call it.
on:
  workflow_call:
jobs:
  linux-build-and-test:
    name: Build and Test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: score-linux-x86_64
            artifact-name: x86_64-linux
            bazel-config: score-linux-x86_64
            build-targets: "//..."
            test-targets: "//score/..."
          - name: score-linux-aarch64
            artifact-name: aarch64-linux
            bazel-config: score-linux-aarch64
            build-targets: "//score/..."
            test-targets: "//score/..."
            test-args: "--test_timeout=180,900,2700,10800" # QEMU emulation is slow
    uses: eclipse-score/cicd-workflows/.github/workflows/bazel.yml@200f97be787848974e55d1f4ef5615efbaa97ff8 # main branch (2026-11-17)
    permissions:
      contents: read
    with:
      runner-labels: ${{ vars.runner_labels_ghub24_standard_x64 || '"ubuntu-24.04"' }}
      build-targets: ${{ matrix.build-targets }}
      test-targets: ${{ matrix.test-targets }}
      bazel-configs: ${{ matrix.bazel-config }}
      test-args: ${{ matrix.test-args || '' }}
      # Run the aarch64 test binaries on the x86_64 runner through QEMU user mode.
      apt-packages: ${{ matrix.bazel-config == 'score-linux-aarch64' && 'qemu-user' || '' }}
      # Each entry keeps its own build and test cache.
      cache-key: linux-build-and-test-${{ matrix.artifact-name }}
      disk-cleanup-level: 4
      artifact-name: test-report-${{ matrix.artifact-name }}-${{ github.run_attempt }}
      retention-days: 5

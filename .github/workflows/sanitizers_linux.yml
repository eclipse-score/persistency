name: Bazel Sanitizers (Linux)
permissions:
  contents: read
# pr.yml calls this workflow on pull requests and merge groups.
# release.yml and cache-maintenance.yml also call it.
on:
  workflow_call:
jobs:
  linux-sanitizers:
    uses: eclipse-score/cicd-workflows/.github/workflows/bazel.yml@200f97be787848974e55d1f4ef5615efbaa97ff8 # main branch (2026-11-17)
    permissions:
      contents: read
    with:
      runner-labels: ${{ vars.runner_labels_ghub24_standard_x64 || '"ubuntu-24.04"' }}
      bazel-configs: score-linux-x86_64 asan_ubsan_lsan
      # ITF and kvs_tool tests run their binaries in a Docker container.
      # The sanitizer wrapper doesn't reach the container, so they are excluded.
      test-targets: //score/... -//score/kvs/rust_kvs_tool/tests/...
      test-args: --build_tests_only --test_tag_filters=-integration-test
      cache-key: linux-sanitizers
      disk-cleanup-level: 4
      artifact-name: sanitizers-linux-testlogs-${{ github.run_attempt }}
      retention-days: 10

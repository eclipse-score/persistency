name: PR Checks

# pr.yml calls this workflow on pull requests and merge groups.
on:
  workflow_call:

jobs:
  common:
    uses: eclipse-score/cicd-workflows/.github/workflows/on-pr.yml@32d0b258660d17e749a41760d4e40f3991bec0a2 # main (2026-11-27)
    with:
      runner-labels: ${{ vars.runner_labels_ghub24_standard_x64 || '"ubuntu-24.04"' }}
      require-bzlmod-lock: true
      format-target: "//tools:format.check"
      copyright-target: "//tools:copyright.check"
    permissions:
      contents: read

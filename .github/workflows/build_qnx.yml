name: Bazel Build (QNX)
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A new PR revision cancels pending approval or execution of the previous one.
# Called runs (warmup, release) finish instead.
concurrency:
  group: qnx-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  qnx-build:
    name: Build and Test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Unit tests run in a QNX VM through score_qnx_unit_tests (see .bazelrc).
          - name: run-under-qnx-x86_64
            bazel-config: run-under-qnx-x86_64
            test-targets: "//score/..."
          - name: run-under-qnx-aarch64
            bazel-config: run-under-qnx-aarch64
            test-targets: "//score/..."
            test-args: "--test_timeout=120,600,1800,7200" # QEMU emulation is slow
          # Component integration tests run in a QNX x86_64 QEMU VM (see //score/kvs/tests:cit_tests).
          # ITF starts the VM itself, so this entry uses the plain QNX config.
          - name: score-qnx-x86_64-cit
            bazel-config: score-qnx-x86_64
            test-targets: "//:cit_tests"
    # Fork PRs require approval in the workflow-approval environment (bazel.yml default).
    # Internal PRs run automatically.
    uses: eclipse-score/cicd-workflows/.github/workflows/bazel.yml@32d0b258660d17e749a41760d4e40f3991bec0a2 # main (2026-11-27)
    permissions:
      contents: read
    with:
      runner-labels: ${{ vars.runner_labels_ghub24_standard_x64 || '"ubuntu-24.04"' }}
      build-targets: "//score/..."
      test-targets: ${{ matrix.test-targets }}
      bazel-configs: ${{ matrix.bazel-config }}
      test-args: ${{ matrix.test-args || '' }}
      setup-qnx-sdp: true
      # All entries start a QEMU VM: the unit tests through run_under, the CITs through ITF.
      setup-qemu: true
      # Each entry keeps its own build and test cache.
      cache-key: ${{ matrix.name }}
      disk-cleanup-level: 4
      artifact-name: qnx-testlogs-${{ matrix.name }}-${{ github.run_attempt }}
    secrets:
      github-token: ${{ secrets.SCORE_BOT_QNX_PKG_PAT }}
      qnx-license: ${{ secrets.SCORE_QNX_LICENSE }}
      qnx-user: ${{ secrets.SCORE_QNX_USER }}
      qnx-password: ${{ secrets.SCORE_QNX_PASSWORD }}

  qnx-mergeable:
    name: QNX mergeable
    needs: [qnx-build]
    # Runs even after failures and cancellations, so it can report them.
    # Only PRs and merge groups need the result.
    # A fork PR passes only after its QNX run is approved.
    if: ${{ always() && (github.event_name == 'pull_request_target' || github.event_name == 'merge_group') }}
    runs-on: ${{ vars.runner_labels_ghub24_standard_x64 && fromJSON(vars.runner_labels_ghub24_standard_x64) || 'ubuntu-24.04' }}
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          # These jobs must succeed.
          # No skip is intended.
          REQUIRED: >-
            qnx-build=${{ needs.qnx-build.result }}
        run: |
          set -euo pipefail
          status=0
          for job in ${REQUIRED}; do
            if [[ "${job#*=}" != "success" ]]; then
              echo "::error::${job%%=*} must succeed, but its result is ${job#*=}."
              status=1
            fi
          done
          exit "${status}"
